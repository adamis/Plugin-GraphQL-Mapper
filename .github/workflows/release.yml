name: Build and Release Eclipse Plugin

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Maven (Tycho)
        run: mvn -B clean package --file pom.xml

      - name: Find Eclipse Plugin JAR
        id: jar
        run: |
          JAR_FILE=$(ls target/*.jar | grep -vE "sources|javadoc" | head -n 1)
          echo "jar_file=$JAR_FILE" >> $GITHUB_OUTPUT
          echo "Found plugin: $JAR_FILE"

      - name: Create GitHub Release and Upload JAR
        uses: ncipollo/release-action@v1
        with:
          artifacts: ${{ steps.jar.outputs.jar_file }}
          token: ${{ secrets.GITHUB_TOKEN }}
